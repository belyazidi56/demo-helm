apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-helm-prod
  namespace: argocd
spec:
  project: default
  source:
    # the chart CI pushes to GHCR (OCI); the promote job sets targetRevision and image.tag
    repoURL: ghcr.io/belyazidi56/charts
    chart: demo-helm
    targetRevision: 0.1.0
    helm:
      releaseName: demo-helm
      valueFiles:
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: demo-prod
  syncPolicy:
    syncOptions:
      - CreateNamespace=true

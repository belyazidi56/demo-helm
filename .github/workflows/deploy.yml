# demo-helm: build → test → package-chart → promote-staging on main; promote-prod only on a
# manual run (workflow_dispatch), like demo-compose's manual prod step.
# Secrets: REGISTRY_TOKEN (GHCR push), ARGOCD_TOKEN. Variables: ARGOCD_SERVER.
# The staging ArgoCD uses a self-signed certificate; the CLI pins it (argocd/server.crt).
# The prod environment is protected; promote-prod waits for its approval.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/demo-helm
  CHART_REPO: oci://ghcr.io/${{ github.repository_owner }}/charts

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: docker build --build-arg COMMIT=${{ steps.tag.outputs.tag }} -t "$IMAGE:${{ steps.tag.outputs.tag }}" .
      - run: docker push "$IMAGE:${{ steps.tag.outputs.tag }}"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build && npm test

  package-chart:
    needs: [build, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint helm -f helm/values-staging.yaml
      - run: echo "${{ secrets.REGISTRY_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: helm package helm && helm push demo-helm-*.tgz "$CHART_REPO"

  promote-staging:
    needs: [build, package-chart]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Install argocd CLI
        run: |
          curl -sSL -o "$RUNNER_TEMP/argocd" https://github.com/argoproj/argo-cd/releases/download/v2.13.2/argocd-linux-amd64
          echo "5a10d1ebc4b903c9cb56279f66ec983134c87c252d9a9d2596dde9867359ef67  $RUNNER_TEMP/argocd" | sha256sum -c -
          sudo install -m 555 "$RUNNER_TEMP/argocd" /usr/local/bin/argocd
      - name: Promote
        env:
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_TOKEN }}
          ARGOCD_SERVER: ${{ vars.ARGOCD_SERVER }}
          APP: demo-helm-staging
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          CHART_VERSION=$(grep '^version:' helm/Chart.yaml | awk '{print $2}')
          argocd app set "$APP" --revision "$CHART_VERSION" --helm-set image.tag="$TAG" --grpc-web --server-crt argocd/server.crt
          argocd app sync "$APP" --grpc-web --server-crt argocd/server.crt
          argocd app wait "$APP" --health --sync --timeout 300 --grpc-web --server-crt argocd/server.crt

  promote-prod:
    needs: [build, promote-staging]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - name: Install argocd CLI
        run: |
          curl -sSL -o "$RUNNER_TEMP/argocd" https://github.com/argoproj/argo-cd/releases/download/v2.13.2/argocd-linux-amd64
          echo "5a10d1ebc4b903c9cb56279f66ec983134c87c252d9a9d2596dde9867359ef67  $RUNNER_TEMP/argocd" | sha256sum -c -
          sudo install -m 555 "$RUNNER_TEMP/argocd" /usr/local/bin/argocd
      - name: Promote
        env:
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_TOKEN }}
          ARGOCD_SERVER: ${{ vars.ARGOCD_SERVER }}
          APP: demo-helm-prod
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          CHART_VERSION=$(grep '^version:' helm/Chart.yaml | awk '{print $2}')
          argocd app set "$APP" --revision "$CHART_VERSION" --helm-set image.tag="$TAG" --grpc-web --server-crt argocd/server.crt
          argocd app sync "$APP" --grpc-web --server-crt argocd/server.crt
          argocd app wait "$APP" --health --sync --timeout 300 --grpc-web --server-crt argocd/server.crt

